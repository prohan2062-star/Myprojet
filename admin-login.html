<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login | PWR</title>

    <link rel="stylesheet"
        href="assets/css/styles.css">

</head>


<body class="auth-page">


    <div class="auth-container">


        <!-- ADMIN INFO -->

        <div class="auth-info">

            <a class="logo" href="index.html">

                <span class="logo-mark">P</span>

                <strong>pwr.</strong>

            </a>


            <div>

                <p class="eyebrow lime-text">
                    Restricted Access
                </p>


                <h1>

                    PWR<br>

                    Admin<br>

                    <span>Panel.</span>

                </h1>


                <p>

                    Secure access for the PWR Digital
                    Solutions administration panel.

                </p>

            </div>


            <ul class="auth-features">

                <li>👥 Manage Users</li>

                <li>📩 View Inquiries</li>

                <li>📊 Manage Projects</li>

            </ul>

        </div>



        <!-- ADMIN FORM -->

        <div class="auth-form-box">

            <h2>Admin Login</h2>

            <p>
                Login with your authorized admin account.
            </p>


            <form
                class="auth-form"
                id="adminLoginForm">


                <div class="form-group">

                    <label>Admin Email</label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="admin@pwr.com"
                        required>

                </div>



                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required>

                </div>



                <button
                    type="submit"
                    class="auth-btn admin-btn">

                    Admin Login →

                </button>


                <p
                    id="authMessage"
                    class="auth-message">

                </p>


            </form>


            <div class="auth-links">

                <a href="login.html">

                    ← Back to User Login

                </a>

            </div>


        </div>


    </div>


    <script
        type="module"
        src="assets/js/auth.js">
    </script>


</body>

</html>
