<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>PWR — Create Account</title>

<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/login.css">


</head>

<body class="auth-page">


<div class="auth-grid"></div>


<header class="auth-header">

    <a href="index.html" class="logo">
        <span class="logo-mark">P</span>
        <strong>pwr.</strong>
    </a>

    <a href="index.html" class="back-home">
        ← Back to website
    </a>

</header>


<main class="auth-container">


    <!-- LEFT SIDE -->

    <section class="auth-brand">

        <p class="eyebrow">
            <span></span> JOIN PWR
        </p>

        <h1>
            Let's build<br>
            <em>something.</em>
        </h1>

        <p class="auth-description">
            Create your PWR account and start your digital journey
            with our team.
        </p>


        <div class="auth-decoration">

            <div class="auth-circle orange-circle"></div>

            <div class="auth-card signup-card">

                <small>PWR / NEW MEMBER</small>

                <strong>
                    START<br>
                    <i>NOW</i>
                </strong>

                <span>Your next digital move starts here. ↗</span>

            </div>

        </div>

    </section>



    <!-- SIGNUP BOX -->

    <section class="auth-box">

        <div class="auth-box-header">

            <p class="eyebrow blue">
                Create account
            </p>

            <h2>
                Join <em>PWR.</em>
            </h2>

            <p>
                Create your account to get started.
            </p>

        </div>


        <form id="signupForm">


            <label>
                Full name

                <input
                    type="text"
                    id="signupName"
                    placeholder="Your full name"
                    required
                >
            </label>



            <label>
                Email address

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="you@email.com"
                    required
                >
            </label>



            <label>
                Password

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required
                >
            </label>



            <label>
                Confirm password

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >
            </label>



            <button type="submit" class="auth-button">

                Create account

                <span>↗</span>

            </button>


            <p class="auth-message" id="signupMessage"></p>


            <div class="auth-divider">

                <span>OR</span>

            </div>


            <p class="signup-text">

                Already have an account?

                <a href="login.html">
                    Login →
                </a>

            </p>


        </form>

    </section>

</main>


<script src="assets/js/auth.js"></script>


</body>

</html>
